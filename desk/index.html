<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#401f04"><meta name="apple-mobile-web-app-title" content="Kitchen Desk"><title>Ed’s Kitchen Desk</title><style>@import url("https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Alegreya+SC:wght@500;700&display=swap");

/* Layout: one narrow parchment column, like the label on the jar. A banner on top, one big result card, sheets slide up for the flavor list and recipe edits. */
:root{
  --bg:#FCEBCC; --surface:#FFF7E6; --ink:#401F04; --muted:#684E42; --accent:#BA804A; --line:#E6CB9C;
  --btn:#401F04; --btn-ink:#FCEBCC; --warn-bg:#F6D9A8; --warn-ink:#5A3300; --ok-bg:#DCE7C3; --ok-ink:#33401A; --shadow:rgba(64,31,4,.18);
  --display:'Alegreya SC',Georgia,'Times New Roman',serif; --text:'Alegreya',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D0E03; --surface:#2B1606; --ink:#FCEBCC; --muted:#D3B891; --accent:#D69B5D; --line:#4B2C12;
  --btn:#BA804A; --btn-ink:#1D0E03; --warn-bg:#4B3410; --warn-ink:#F6D9A8; --ok-bg:#2F3A18; --ok-ink:#DCE7C3; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D0E03; --surface:#2B1606; --ink:#FCEBCC; --muted:#D3B891; --accent:#D69B5D; --line:#4B2C12;
  --btn:#BA804A; --btn-ink:#1D0E03; --warn-bg:#4B3410; --warn-ink:#F6D9A8; --ok-bg:#2F3A18; --ok-ink:#DCE7C3; --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.35;margin:0;padding-inline:16px;padding-block:14px 40px;font-variant-numeric:lining-nums tabular-nums;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banner{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.banner img{width:64px;height:64px;flex:none;filter:drop-shadow(0 2px 3px var(--shadow))}
.banner h1{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.05;margin:0;letter-spacing:.02em;text-wrap:balance}
.banner p{margin:3px 0 0;font-size:14px;color:var(--muted);letter-spacing:.04em}
.label{font-family:var(--display);font-size:14px;letter-spacing:.12em;color:var(--muted);text-transform:none;margin:0 0 6px}
.picker{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px;min-height:56px}
.picker b{font-weight:700;font-size:19px;line-height:1.15;min-width:0}
.picker .chev{flex:none;font-size:22px;color:var(--accent)}
.row{display:flex;gap:10px;align-items:stretch}
.step{width:58px;flex:none;font-size:30px;line-height:1;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px}
.step:active{transform:scale(.96)}
#jars{flex:1;min-width:0;text-align:center;font:700 34px var(--text);font-variant-numeric:lining-nums tabular-nums;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;padding:6px 8px;height:58px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:transparent;border:1.5px solid var(--accent);border-radius:999px;padding:5px 14px;font-size:16px;color:var(--ink)}
.chip.on{background:var(--accent);color:var(--bg);font-weight:700}
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:16px;box-shadow:0 3px 0 var(--ink)}
.card h2{font-family:var(--display);font-weight:700;font-size:23px;margin:0;letter-spacing:.03em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stat{border-top:2px solid var(--accent);padding-top:6px;min-width:0}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted);letter-spacing:.04em}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:12px 0 2px}
.seg button{flex:1;background:transparent;border:0;padding:7px 8px;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:700}
.seg.lists{margin-top:8px;border-width:1px;border-color:var(--line)}
.seg.lists button{font-size:14px;padding:6px 4px}
ul.ing{list-style:none;margin:10px 0 0;padding:0}
ul.ing li{border-top:1px solid var(--line)}
ul.ing button{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:left;background:none;border:0;padding:11px 2px}
.nm{min-width:0;flex:1}
.nm small{display:block;font-size:13.5px;color:var(--muted)}
.am{text-align:right;flex:none}
.am b{display:block;font-size:22px;line-height:1.1;white-space:nowrap}
.am small{font-size:14px;color:var(--muted)}
li.done .nm,li.done .am{opacity:.4;text-decoration:line-through}
ul.ing.amts li{display:flex;align-items:center;gap:6px}
ul.ing.amts li>button.row{flex:1;min-width:0}
ul.ing button.amt{width:auto;flex:none;display:block;padding:8px 2px 8px 8px;color:inherit;border-bottom:1.5px dashed var(--line)}
ul.ing li.fixed button.amt{border-bottom-color:var(--accent)}
.amtin{display:flex;align-items:center;gap:6px;flex:none}
.amtin input{width:96px;font:inherit;font-size:20px;text-align:right;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);border-radius:8px;padding:6px 8px}
.amtin span{color:var(--muted);font-size:15px}
.tick{flex:none;width:22px;height:22px;border:1.5px solid var(--accent);border-radius:6px;align-self:center;margin-right:2px;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--btn-ink)}
li.done .tick{background:var(--accent)}
li.done .tick::after{content:"\2713"}
.mixf{margin-top:16px}
.mixf h3{font-size:18px;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mixf h3 span{font-size:14.5px;font-weight:400;color:var(--muted);white-space:nowrap}
ul.ing.pick li.on .tick{background:var(--accent)}
ul.ing.pick li.on .tick::after{content:"\2713"}
ul.ing.pick li:not(.on) .nm,ul.ing.pick li:not(.on) .am{opacity:.55}
ul.ing.pick button{padding:8px 2px}
ul.ing.pick .am b{font-size:18px}
.mixsum{margin-top:18px;padding-top:12px;border-top:2px solid var(--ink)}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
.pill{font-size:14px;border-radius:999px;padding:3px 11px;letter-spacing:.03em}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:16px;padding:6px 2px}
.tiny{font-size:14px;color:var(--muted);margin:0}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:16px}
.opts label{display:flex;align-items:center;gap:8px}
.opts input{width:76px;font:inherit;font-size:18px;text-align:center;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:6px}
.tip{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:15.5px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.tip button{background:none;border:0;font-size:20px;line-height:1;padding:0 4px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;overscroll-behavior:none;touch-action:none;background:rgba(20,8,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:520px;max-height:85vh;max-height:85dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--bg);border-radius:16px 16px 0 0;border:1.5px solid var(--ink);border-bottom:0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.panel h3{font-family:var(--display);font-size:21px;margin:0 0 4px;letter-spacing:.03em}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;font-size:19px;line-height:1.2}
.opt[aria-checked="true"]{border-color:var(--ink);box-shadow:0 2px 0 var(--ink);font-weight:700}
.opt small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.erow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.erow .nm{flex:1}
.erow input{width:92px;font:inherit;font-size:19px;text-align:right;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:7px 8px}
.erow .u{width:42px;color:var(--muted);font-size:15px}
.erow .x{background:none;border:0;font-size:22px;color:var(--muted);padding:4px 8px}
.erow select,.add select{font:inherit;font-size:17px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px;width:100%}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:18px;flex:1}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-weight:500}
/* iPad and other wide screens: keep the single parchment column but give it room */
@media (min-width:700px){body{font-size:20px;padding-inline:28px}.wrap{max-width:760px}.panel{max-width:680px;border-radius:16px;border-bottom:1.5px solid var(--ink);margin-bottom:24px}.tabbar button{max-width:170px;font-size:14px}}
@media (prefers-reduced-motion:no-preference){.step,.chip,.btn{transition:transform .08s}}

/* ---- suite: tab bar, panes, shared bits ---- */
body{padding-block-end:calc(92px + env(safe-area-inset-bottom,0px))}
body.noscroll{overflow:hidden}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:0;background:var(--surface);border-top:2px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:130px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--muted);font-family:var(--display);font-size:13px;letter-spacing:.08em}
.tabbar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabbar button[aria-selected="true"] svg{stroke-width:2.4}
.tabpane[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{font-family:var(--display);font-size:20px;letter-spacing:.06em;margin:10px 0 0}
.card.ev h2,.card h2{font-size:21px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;margin:10px 0;font-size:16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.btns2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn.small{flex:0 0 auto;font-size:14.5px;padding:9px 13px;border-radius:9px;text-decoration:none;display:inline-block;line-height:1.1}
.btn.solid{background:var(--btn);color:var(--btn-ink);border:0}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px dashed var(--accent);font-weight:500}
.btn[disabled]{opacity:.45}
a.btn.alt{color:var(--ink)}
.search,.fld input{width:100%;font:inherit;font-size:17px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.fld{display:block;margin-top:10px}
.fld input{margin-top:4px}
.feerow input{width:96px;font:inherit;font-size:17px;text-align:right;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;margin-left:6px}
.cb{display:flex;align-items:center;gap:8px;margin-top:10px}
.evmove{border-top:1px solid var(--line);padding-top:10px}
table.mini{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
table.mini th{font-family:var(--display);font-weight:500;text-align:left;color:var(--muted);padding:3px 4px;border-bottom:1px solid var(--line)}
table.mini td{padding:5px 4px;border-bottom:1px solid var(--line)}
/* Jar Prices tab */
.jarhero .label{margin:0}
.jarhero h2{margin-top:2px}
.bigprice{font:700 44px/1 var(--text);font-variant-numeric:lining-nums tabular-nums;margin:10px 0 2px;letter-spacing:-.01em}
.bigprice small{font-size:18px;font-weight:500;color:var(--muted);margin-left:4px}
.jarmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.savings{display:block;margin-top:12px;padding:8px 12px;border-radius:10px;background:var(--ok-bg);color:var(--ok-ink);font-weight:700;font-size:16px}
.jarchg{margin:8px 0 0;font-size:15px}
.jarchg.down{color:var(--ok-ink)}
.jarlist{list-style:none;margin:10px 0 0;padding:0}
.jarlist li{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.jarlist li:first-child{border-top:0}
.jarlist .rk{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);text-align:center}
.jarlist .who{font-weight:700}
.jarlist .who small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.jarlist .per{font-weight:700;text-align:right;white-space:nowrap}
.jarlist .per small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.jarlist .more{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pullnote{text-align:center;font-size:14px;color:var(--muted);height:0;overflow:hidden;transition:height .15s}
.pullnote.on{height:28px}
.neg{color:#9A2A1A;font-weight:700}
.warnline{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:8px 10px;font-size:15px;margin:8px 0 0}
.okline{background:var(--ok-bg);color:var(--ok-ink);border-radius:8px;padding:8px 10px;font-size:15px;margin:8px 0 0}
.qlink{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.qlink .btns2{margin:0}
.sheet2{position:fixed;inset:0;z-index:30;background:rgba(20,8,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet2[hidden]{display:none}
.sheet2 .panel{touch-action:pan-y}
.qr{width:min(78vw,320px);height:auto;display:block;margin:12px auto;border:6px solid #fff;border-radius:6px}
.urlline{word-break:break-all;text-align:center}
.lpage{margin-top:10px}.lpage h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:600}
.lsheet{position:relative;width:100%;height:0;background:#fff;border:1.5px solid var(--line);border-radius:6px;box-sizing:border-box}
.lsheet.portrait{margin:0 auto}.flights{margin-top:10px}.flights .lrow span{flex:1 1 auto}.flights .lrow button{flex:0 0 auto}.flights p.tiny{margin:4px 0 0}
.lslot{position:absolute;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:6px;padding:2px 18px 2px 4px;text-align:center;font-size:12px;line-height:1.15;background:var(--surface);display:flex;align-items:center;justify-content:center;overflow:hidden}
#conncard{margin-top:14px}
.connbox>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}
.connbox>summary::-webkit-details-marker{display:none}
.connbox .connh{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.03em}
.connbox .connh::after{content:' \25BE';color:var(--accent);font-size:18px}
.connbox:not([open]) .connh::after{content:' \25B8'}
.lslot.round{border-radius:50%;padding:2px 14px;background:#fff;color:#4A2610;border:1.5px solid #A8693B;font-family:var(--display);font-weight:700;letter-spacing:.03em}
.lslot.round .x{color:#A8693B}
.lslot .x{position:absolute;top:0;right:0;background:none;border:0;font-size:18px;line-height:1;color:var(--muted);padding:2px 5px}
.lpick{margin:12px 0 4px}.lfilters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lfilter{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:18px;padding:5px 11px;font-size:15px;background:var(--surface)}
.lfilter input{width:18px;height:18px;margin:0}.lidauto{margin-top:8px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ltile{position:relative;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.ltile .lmain{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 7px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;transition:transform .1s}
.ltile .lmain:active{transform:scale(.97)}
.lstep{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 6px 6px}
.lstep button{width:40px;height:36px;border-radius:8px;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);font:inherit;font-size:22px;font-weight:700;line-height:1;cursor:pointer}
.lstep .lcount{flex:1;text-align:center;font-size:14px;font-weight:700}
.ltile img{width:100%;height:76px;object-fit:contain;border-radius:4px;background:#fff}
.ltile .lname{font-size:14px;font-weight:700;line-height:1.15;text-align:center}.ltile .lkind{font-size:12px;color:var(--muted)}
.ltile.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset;background:var(--ok-bg)}
.ltile .lbadge{position:absolute;top:4px;right:4px;background:var(--accent);color:#fff;border-radius:11px;padding:1px 8px;font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){.ltile{transition:none}.ltile .lmain:active{transform:none}}
.chk{display:flex;align-items:center;gap:8px;flex:1}.chk input[type=checkbox]{width:22px;height:22px}
.erow input.cnt{width:64px;font-size:17px;padding:5px 6px}
.lrow{display:flex;gap:8px;align-items:center;margin-top:10px}.lrow select{flex:1 1 0;min-width:0;text-overflow:ellipsis;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px}.lrow input{width:64px;font:inherit;font-size:17px;text-align:center;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:7px}
.stocklist{margin-top:8px}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.srow .nm{flex:1;min-width:0}
.srow input{width:84px;font:inherit;font-size:22px;text-align:center;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;padding:8px}
details.how{margin:8px 0;font-size:15.5px} details.how summary{cursor:pointer;color:var(--accent);font-weight:700}
details.how ol{margin:6px 0 0;padding-left:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:16px;max-width:90vw}
.verline{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.updbar{text-align:center;margin:6px auto 0;max-width:420px;padding:0 16px}
.updbar p{font-size:13px;color:var(--muted);margin:6px 0 0}

  function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch(e){return fallback;}}
  function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(e){$('update-status').textContent='This browser cannot save device-local progress.';}}
  function h(tag,attrs,kids){var el=document.createElement(tag);Object.keys(attrs||{}).forEach(function(k){var v=attrs[k];if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined)el.setAttribute(k,String(v));});(kids||[]).forEach(function(x){if(x)el.appendChild(typeof x==='string'?document.createTextNode(x):x);});return el;}
  function nativeAvailable(){return !!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native);}
  function nativeCall(cmd,args){return new Promise(function(resolve,reject){if(!nativeAvailable()){reject(new Error('This check is available in the installed Kitchen Desk app.'));return;}var id=++seq;pending[id]={resolve:resolve,reject:reject};window.webkit.messageHandlers.native.postMessage({id:id,cmd:cmd,args:args||{}});});}
  window.__nativeReply=function(id,ok,value){var p=pending[id];if(!p)return;delete pending[id];if(ok)p.resolve(value);else p.reject(new Error(typeof value==='string'?value:'The app could not complete that action.'));};
  function extLink(label,url){return h('a',{class:'btn small alt',href:C.isHttpsUrl(url)?url:null,target:'_blank',rel:'noopener','data-ext':'1',text:label});}
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-ext]');if(!a||!nativeAvailable())return;e.preventDefault();nativeCall('openURL',{url:a.getAttribute('href')}).catch(function(err){$('update-status').textContent=err.message;});});
  function toolHelp(tool){var names={calc:'Batch',stock:'Stock',events:'Events',jars:'Jar Prices',store:'Store'};$('tool-instructions').textContent='Open your separate Ed’s Kitchen Ops app and choose '+(names[tool]||'Batch')+'. Kitchen Desk does not change the calculator, inventory, or print queue.';$('tool-help').showModal();}
  $('close-help').onclick=function(){$('tool-help').close();};
  function draw(){window.EKDesk.draw($('desk'),{h:h,core:C,data:model,store:window.EK_STORE,labels:window.EK_LABELS,thumbs:window.EK_THUMBS,events:events,jars:jars,privateRecord:privateRecord,eventSource:eventSource,version:window.EK_VERSION,header:function(title,sub){return h('header',{class:'banner'},[h('img',{src:window.EK_LOGO,alt:'Ed’s Kitchen — artisanal and handmade'}),h('div',null,[h('h1',{text:title}),h('p',{text:sub})])]);},showTab:toolHelp,extLink:extLink,readProgress:function(){return read(PROGRESS,{});},saveProgress:function(v){save(PROGRESS,v);}});}
  var cached=C.normalizeFeed(read('desk-events',null),Math.ceil(events.length/2));if(cached){events=cached.events;eventSource='saved · '+cached.updated;}
  var cachedJars=C.normalizeJars(read('desk-jars',null));if(cachedJars)jars=cachedJars;
  function refreshFeeds(){if(busy||Date.now()-lastFeedCheck<10*60*1000||typeof fetch!=='function')return;busy=true;lastFeedCheck=Date.now();
    Promise.allSettled([
      fetch('https://raw.githubusercontent.com/edbarros/eds-kitchen-events/main/events.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(raw){var f=C.normalizeFeed(raw,Math.ceil(window.EK_EVENTS.length/2));if(!f)throw Error();events=f.events;eventSource='live · '+f.updated;save('desk-events',f);}),
      fetch('https://raw.githubusercontent.com/edbarros/eds-kitchen-events/main/jars/jars.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(raw){var f=C.normalizeJars(raw);if(!f)throw Error();jars=f;save('desk-jars',f);})
    ]).then(function(){busy=false;if(window.EKDesk.needsEventRefresh())draw();});
  }
  $('version').textContent='Kitchen Desk v'+window.EK_VERSION+' · '+(window.__appInfo?'installed app':'web preview');
  var ready=false;function downloaded(version){ready=true;$('use-update').hidden=false;$('update-status').textContent='Signed update '+version+' is ready.';}
  window.__otaReady=downloaded;
  $('check-update').onclick=function(){var button=$('check-update');button.disabled=true;$('update-status').textContent='Checking the signed update feed…';nativeCall('updateCheck').then(function(r){if(r.result==='downloaded')downloaded(r.version);else $('update-status').textContent=r.result==='needsApp'?'A new app install from your Mac is needed for '+r.version+'.':'This device is up to date.';}).catch(function(err){$('update-status').textContent=err.message;}).then(function(){button.disabled=false;});};
  $('use-update').onclick=function(){if(ready)nativeCall('updateReload').catch(function(err){$('update-status').textContent=err.message;});};
  function acceptPrivate(record){if(record&&record.schema===1&&Array.isArray(record.notes)){privateRecord=record;$('private-status').textContent='Private record connected · source '+record.sourceDate;draw();}}
  $('connect-private').onclick=function(){nativeCall('privateConnect').then(acceptPrivate).catch(function(err){$('private-status').textContent=err.message;});};
  $('refresh-private').onclick=function(){nativeCall('privateRefresh').then(acceptPrivate).catch(function(err){$('private-status').textContent=err.message+' Keeping any saved copy.';});};
  window.__privateRefresh=function(){if(nativeAvailable()&&Date.now()-lastPrivateCheck>10*60*1000){lastPrivateCheck=Date.now();nativeCall('privateRefresh').then(acceptPrivate).catch(function(){});}};
  if(nativeAvailable()){nativeCall('privateRead').then(acceptPrivate).then(function(){return nativeCall('privateRefresh');}).then(acceptPrivate).catch(function(){/* Offline or no selected record: retain the last valid copy. */});}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshFeeds();});
  draw();refreshFeeds();
})();
</script></body></html>
